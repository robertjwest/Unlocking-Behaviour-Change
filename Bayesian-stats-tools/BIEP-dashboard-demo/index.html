<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIEP evaluation dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
/* Layout idea: a working tool. Navy header with tabs, summary first, dense tables with inline interval charts. Single light theme by choice. */
:root{
  color-scheme: light;
  --bg:#f3f5f9; --surface:#ffffff; --ink:#14213d; --ink-2:#44506a; --muted:#6f7b93; --line:#dbe1ec; --line-2:#eef1f6;
  --accent:#1f5fbf; --accent-soft:#e7effb; --navy:#14213d;
  --good:#0ca30c; --good-ink:#0a640a; --good-bg:#e6f5e6;
  --warn:#fab219; --warn-ink:#7a5200; --warn-bg:#fdf1d3;
  --crit:#d03b3b; --crit-ink:#a02626; --crit-bg:#fbe7e7;
  --none-ink:#5b6577; --none-bg:#eceff4;
  --series:#2a78d6;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
header{background:var(--navy);color:#fff;padding:18px 24px 0}
.hd{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline;justify-content:space-between;max-width:1280px;margin:0 auto}
h1{font-size:21px;font-weight:600;margin:0;text-wrap:balance}
.hd small{color:#c5cfe3;font-size:13px}
.demo{display:inline-block;background:var(--warn);color:#3d2a00;font-weight:600;font-size:12px;padding:2px 8px;border-radius:3px;margin-left:8px;vertical-align:2px}
nav{display:flex;flex-wrap:wrap;gap:2px;max-width:1280px;margin:14px auto 0}
nav button{font:inherit;font-weight:500;color:#c5cfe3;background:none;border:0;padding:9px 14px;border-radius:6px 6px 0 0;cursor:pointer}
nav button:hover{color:#fff}
nav button[aria-selected="true"]{background:var(--bg);color:var(--ink)}
button:focus-visible,select:focus-visible,input:focus-visible,tr[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:1280px;margin:0 auto;padding:22px 24px 48px;display:flex;flex-direction:column;gap:22px}
h2{font-size:17px;font-weight:600;margin:0 0 4px}
h3{font-size:14px;font-weight:600;margin:0}
p{margin:0 0 8px;max-width:75ch}
.note{color:var(--ink-2);font-size:13.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
.grid{display:grid;gap:14px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.tile b{display:block;font-size:26px;font-weight:600;line-height:1.15}
.tile span{color:var(--ink-2);font-size:13px}
.targets{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.tcard{display:flex;flex-direction:column;gap:8px}
.big{font-size:34px;font-weight:600;line-height:1}
.row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill i{font-style:normal;font-size:11px}
.on{background:var(--good-bg);color:var(--good-ink)} .unc{background:var(--warn-bg);color:var(--warn-ink)}
.off{background:var(--crit-bg);color:var(--crit-ink)} .none{background:var(--none-bg);color:var(--none-ink)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-weight:600;text-align:left;color:var(--ink-2);font-size:12.5px;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:bottom}
td{padding:7px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
td.n,th.n{text-align:right}
td small{color:var(--muted);display:block;font-size:12px}
tr.grp td{background:var(--line-2);font-weight:600;font-size:12.5px;color:var(--ink-2);padding:4px 10px}
tr.pick{cursor:pointer} tr.pick:hover td{background:var(--accent-soft)} tr.sel td{background:var(--accent-soft)}
.mini{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.mini .card{padding:12px 14px}
.mini h3{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:4px}
svg{display:block;max-width:100%}
svg text{font-family:var(--body);font-size:11px;fill:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end}
label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
select,input[type=number],input[type=search],input[type=text]{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:120px}
input[type=number]{min-width:0;width:90px}
.btn{font:inherit;font-weight:500;background:var(--accent);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer}
.btn.alt{background:var(--surface);color:var(--accent);border:1px solid var(--accent)}
.mono{font-family:var(--mono);font-size:13px}
.two{display:grid;grid-template-columns:minmax(320px,5fr) minmax(360px,7fr);gap:18px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.list{max-height:640px;overflow:auto}
.list th{position:sticky;top:0;background:var(--surface)}
.bar3{display:inline-flex;width:84px;height:10px;border-radius:3px;overflow:hidden;background:var(--none-bg);gap:1px;vertical-align:middle}
.bar3 span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2);align-items:center}
.legend svg{display:inline-block;vertical-align:middle}
.msg{border-left:4px solid var(--line);padding:6px 12px;margin:0 0 8px;background:var(--surface)}
.msg.error{border-color:var(--crit)} .msg.warning{border-color:var(--warn)} .msg.info{border-color:var(--series)}
.msg small{color:var(--muted);display:block}
#tip{position:fixed;z-index:9;pointer-events:none;background:var(--navy);color:#fff;font-size:12.5px;line-height:1.35;padding:6px 9px;border-radius:5px;max-width:280px;display:none;white-space:pre-line}
dl{display:grid;grid-template-columns:max-content 1fr;gap:3px 14px;margin:0;font-size:14px}
dt{color:var(--ink-2)} dd{margin:0}
ul{margin:0 0 8px;padding-left:20px;max-width:75ch}
</style>
</head>

,process,ordinal,1-5,higher,0.5,change,0|1|2|3,excluded,\nchoice,outcomes,Choice,process,ordinal,1-5,higher,0.5,change,0|1|2|3,excluded,\nps_finance,outcomes,Practical stability: finance,component,ordinal,1-5,,,,0|1|2|3,,\nps_housing,outcomes,Practical stability: housing,component,ordinal,1-5,,,,0|1|2|3,,\nps_transport,outcomes,Practical stability: transport,component,ordinal,1-5,,,,0|1|2|3,,\nps_care,outcomes,Practical stability: care,component,ordinal,1-5,,,,0|1|2|3,,\n", "schedule": "assessment_no,due_day,window_days\n0,0,7\n1,28,7\n2,84,14\n3,182,14\n"}</script>
<script>
'use strict';
/* ============================================================ helpers */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mean = a => a.reduce((s, x) => s + x, 0) / a.length;
const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function day(s){ const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); if(!m) return NaN; return Math.round(Date.UTC(+m[1], +m[2]-1, +m[3]) / 864e5); }
function dstr(d){ if(d == null || isNaN(d)) return ''; const t = new Date(d * 864e5); return t.getUTCDate() + ' ' + MONTHS[t.getUTCMonth()] + ' ' + t.getUTCFullYear(); }
const TODAY = Math.floor(Date.now() / 864e5);

function parseCSV(text){
  const rows = []; let row = [], f = '', q = false; text = text.replace(/^﻿/, '');
  for(let i = 0; i < text.length; i++){ const c = text[i];
    if(q){ if(c === '"'){ if(text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if(c === '"') q = true;
    else if(c === ','){ row.push(f); f = ''; }
    else if(c === '\n' || c === '\r'){ if(c === '\r' && text[i+1] === '\n') i++; row.push(f); f = ''; if(row.length > 1 || row[0] !== '') rows.push(row); row = []; }
    else f += c; }
  if(f !== '' || row.length){ row.push(f); rows.push(row); }
  if(!rows.length) return Object.assign([], {columns: []});
  const head = rows[0].map(s => s.trim());
  const out = rows.slice(1).map((r, i) => { const o = {_row: i + 2}; head.forEach((k, j) => o[k] = (r[j] ?? '').trim()); return o; });
  out.columns = head; return out;
}

/* ============================================================ statistics */
function lgamma(x){ const c = [76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];
  let y = x, t = x + 5.5; t -= (x + 0.5) * Math.log(t); let s = 1.000000000190015; for(let j = 0; j < 6; j++) s += c[j] / ++y; return -t + Math.log(2.5066282746310005 * s / x); }
function betacf(a, b, x){ const FP = 1e-300; let qab = a + b, qap = a + 1, qam = a - 1, c = 1, d = 1 - qab * x / qap; if(Math.abs(d) < FP) d = FP; d = 1 / d; let h = d;
  for(let m = 1; m <= 400; m++){ const m2 = 2 * m; let aa = m * (b - m) * x / ((qam + m2) * (a + m2));
    d = 1 + aa * d; if(Math.abs(d) < FP) d = FP; c = 1 + aa / c; if(Math.abs(c) < FP) c = FP; d = 1 / d; h *= d * c;
    aa = -(a + m) * (qab + m) * x / ((a + m2) * (qap + m2));
    d = 1 + aa * d; if(Math.abs(d) < FP) d = FP; c = 1 + aa / c; if(Math.abs(c) < FP) c = FP; d = 1 / d; const del = d * c; h *= del; if(Math.abs(del - 1) < 3e-14) break; }
  return h; }
function ibeta(x, a, b){ if(x <= 0) return 0; if(x >= 1) return 1;
  const bt = Math.exp(lgamma(a + b) - lgamma(a) - lgamma(b) + a * Math.log(x) + b * Math.log(1 - x));
  return x < (a + 1) / (a + b + 2) ? bt * betacf(a, b, x) / a : 1 - bt * betacf(b, a, 1 - x) / b; }
function qbeta(p, a, b){ let lo = 0, hi = 1; for(let i = 0; i < 60; i++){ const m = (lo + hi) / 2; if(ibeta(m, a, b) < p) lo = m; else hi = m; } return (lo + hi) / 2; }
function tcdf(t, nu){ const p = 0.5 * ibeta(nu / (nu + t * t), nu / 2, 0.5); return t > 0 ? 1 - p : p; }
function qt(p, nu){ let lo = -400, hi = 400; for(let i = 0; i < 80; i++){ const m = (lo + hi) / 2; if(tcdf(m, nu) < p) lo = m; else hi = m; } return (lo + hi) / 2; }
function pnorm(z){ const t = 1 / (1 + 0.2316419 * Math.abs(z)); const d = 0.3989422804014327 * Math.exp(-z * z / 2);
  const p = d * t * (0.319381530 + t * (-0.356563782 + t * (1.781477937 + t * (-1.821255978 + t * 1.330274429)))); return z > 0 ? 1 - p : p; }

/* ============================================================ state */
const S = { tab: 'overview', hi: 0.8, lo: 0.2, prior: 2, kappa: 5, rel: 0.7, minCell: 5, asAtMode: 'data', ivGroup: '',
            segOutcome: '', segK: '', split1: 'provider_id', split2: '', person: '', q: '', fProv: '', fFlag: '' };
let RAW = null, M = null, SOURCE = '', LOADERR = '';
const TABS = [['overview','Overview'],['segments','Segments'],['interventions','Interventions'],['individuals','Individuals'],['data-checks','Data and checks'],['method','Method and options']];
const REQUIRED = { recipients: ['client_id','enrolment_date','consent_status'], exposure: ['exposure_id','client_id','intervention_id','status'],
                   outcomes: ['client_id','assessment_no','status'], config: ['variable','table','role','data_type'], schedule: ['assessment_no','due_day','window_days'] };

/* ============================================================ model */
function parseDef(s){ const o = {start: '', end: '', min: 0, within: 0}; (s || '').split(';').forEach(p => { const [k, v] = p.split('=').map(x => (x || '').trim());
  if(k === 'start') o.start = v; if(k === 'end') o.end = v; if(k === 'min_days') o.min = +v; if(k === 'within_days') o.within = +v; }); return o; }

function buildModel(raw){
  const msgs = [];
  const add = (level, rule, ex) => { let m = msgs.find(x => x.rule === rule); if(!m){ m = {level, rule, count: 0, ex: []}; msgs.push(m); } m.count++; if(ex && m.ex.length < 5) m.ex.push(ex); };
  for(const t in REQUIRED){ if(!raw[t]){ add('error', 'Table missing: ' + t + '.csv'); raw[t] = Object.assign([], {columns: []}); continue; }
    for(const c of REQUIRED[t]) if(!raw[t].columns.includes(c)) add('error', 'Required column missing in ' + t + ': ' + c); }
  if(!raw.events) raw.events = Object.assign([], {columns: []});

  /* configuration */
  const vars = {}, order = [];
  for(const c of raw.config){ if(!c.variable) continue;
    const v = { name: c.variable, table: (c.table || '').toLowerCase(), label: c.label || c.variable, role: (c.role || '').toLowerCase(), type: (c.data_type || '').toLowerCase(),
      dir: (c.direction || 'higher').toLowerCase(), bench: c.benchmark === '' || c.benchmark == null ? null : +c.benchmark, basis: (c.benchmark_basis || 'level').toLowerCase(),
      miss: (c.missing_rule || 'excluded').toLowerCase(), codes: null, labels: {}, min: null, max: null, at: null };
    const rc = c.range_or_codes || ''; const mm = /^\s*(-?\d+(?:\.\d+)?)\s*-\s*(-?\d+(?:\.\d+)?)\s*$/.exec(rc);
    if(['continuous','count','ordinal'].includes(v.type) && mm){ v.min = +mm[1]; v.max = +mm[2]; }
    else if(rc){ v.codes = []; rc.split('|').forEach(p => { const i = p.indexOf('='); const k = (i < 0 ? p : p.slice(0, i)).trim(); v.codes.push(k); v.labels[k] = i < 0 ? k : p.slice(i + 1).trim(); }); }
    if(c.assessed_at) v.at = c.assessed_at.split('|').map(x => +x.trim());
    if(v.type === 'event'){ v.ev = parseDef(c.definition); if(!v.ev.start || !v.ev.within) add('error', 'Event outcome needs a definition with start= and within_days=', v.name); }
    if(v.table === 'outcomes' && c.definition){ const d = {}; c.definition.split(';').forEach(q => { const i = q.indexOf('='); if(i > 0) d[q.slice(0, i).trim()] = q.slice(i + 1).trim(); });
      if(d.mean) v.derive = {mean: d.mean.split('|').map(x => x.trim())}; else if(d.source && d.at_least) v.derive = {source: d.source, atLeast: +d.at_least}; else add('error', 'Definition not understood', v.name); }
    if(['process','target'].includes(v.role) && v.bench == null) add('error', 'Outcome has no benchmark in the configuration table', v.name);
    vars[v.name] = v; order.push(v); }
  const sched = {}; for(const s of raw.schedule) sched[+s.assessment_no] = {due: +s.due_day, win: +s.window_days};
  const ks = Object.keys(sched).map(Number).sort((a, b) => a - b);
  const numeric = v => ['continuous','count','ordinal','binary'].includes(v.type);
  const check = (v, val, where) => { // returns cleaned value or null
    if(val === '' || val == null) return null;
    if(numeric(v)){ const x = +val; if(isNaN(x)){ add('error', 'Value is not a number: ' + v.name, where + ' = ' + val); return null; }
      if(v.min != null && (x < v.min || x > v.max)){ add('error', 'Value outside the range in the configuration table: ' + v.name, where + ' = ' + val); return null; }
      if(v.codes && !v.codes.includes(String(val))){ add('error', 'Value not in the code list: ' + v.name, where + ' = ' + val); return null; }
      return x; }
    if(v.codes && !v.codes.includes(val)){ add('error', 'Value not in the code list: ' + v.name, where + ' = ' + val); return null; }
    return val; };
  const dchk = (s, where, what) => { if(!s) return null; const d = day(s); if(isNaN(d)){ add('error', 'Date is not in ISO format (YYYY-MM-DD): ' + what, where + ' = ' + s); return null; }
    if(d > TODAY) add('error', 'Date is after today: ' + what, where + ' = ' + s); return d; };

  /* recipients */
  const byId = new Map(), all = [];
  const rVars = order.filter(v => v.table === 'recipients'), xVars = order.filter(v => v.table === 'exposure'), oVars = order.filter(v => v.table === 'outcomes' && !v.derive), dVars = order.filter(v => v.table === 'outcomes' && v.derive);
  for(const v of dVars) for(const n of v.derive.mean || [v.derive.source]) if(!vars[n] || vars[n].table !== 'outcomes') add('error', 'Definition refers to a variable that is not in the outcomes table', v.name + ': ' + n);
  for(const r of raw.recipients){ if(byId.has(r.client_id)){ add('error', 'client_id appears more than once in recipients', r.client_id); continue; }
    const p = { id: r.client_id, c: {}, enrol: dchk(r.enrolment_date, r.client_id, 'enrolment_date'), exit: dchk(r.exit_date, r.client_id, 'exit_date'),
      exitReason: r.exit_reason || '', consent: (r.consent_status || '').toLowerCase(), A: {}, X: [], E: [], ach: {} };
    if(p.enrol == null) add('error', 'Recipient has no valid enrolment_date', r.client_id);
    for(const v of rVars) p.c[v.name] = check(v, r[v.name], r.client_id);
    for(const k of ['provider_id','site_id']) if(!(k in p.c) && r[k]) p.c[k] = r[k];
    p.in = p.consent === 'given' && p.enrol != null; byId.set(p.id, p); all.push(p); }
  const link = (id, table, row) => { const p = byId.get(id); if(!p){ add('error', 'client_id in ' + table + ' is not in recipients', id + ' (row ' + row + ')'); return null; }
    if(!p.in){ add('warning', 'Rows supplied for a recipient without consent (excluded): ' + table, id); return null; } return p; };

  /* outcomes */
  for(const o of raw.outcomes){ const p = link(o.client_id, 'outcomes', o._row); if(!p) continue;
    const k = +o.assessment_no; const where = p.id + ' assessment ' + o.assessment_no;
    if(o.assessment_no === '' || !Number.isInteger(k)){ add('error', 'assessment_no is not an integer', where); continue; }
    if(!(k in sched)){ add('warning', 'assessment_no is not in the schedule (row ignored)', where); continue; }
    if(p.A[k]){ add('error', 'More than one row for the same recipient and assessment number (first kept)', where); continue; }
    const a = { k, status: (o.status || '').toLowerCase(), date: dchk(o.assessment_date, where, 'assessment_date'), v: {} }; let any = false;
    for(const v of oVars){ const x = check(v, o[v.name], where); a.v[v.name] = x; if(x != null) any = true; }
    if(a.status === 'observed'){ if(!any) add('error', 'Observed row has no outcome values', where);
      if(a.date == null) add('error', 'Observed row has no assessment_date', where);
      else { if(k > 0 && a.date < p.enrol) add('error', 'Follow-up assessment dated before enrolment', where);
        if(Math.abs(a.date - (p.enrol + sched[k].due)) > sched[k].win) add('warning', 'Assessment date outside the window in the schedule', where + ', ' + (a.date - p.enrol - sched[k].due) + ' days from due date'); } }
    else if(any){ add('warning', 'Row that is not observed carries outcome values (values ignored)', where); for(const v of oVars) a.v[v.name] = null; }
    for(const v of dVars){ if(v.derive.mean){ const xs = v.derive.mean.map(n => a.v[n]).filter(x => x != null); a.v[v.name] = xs.length ? mean(xs) : null; }
      else { const x = a.v[v.derive.source]; a.v[v.name] = x == null ? null : x >= v.derive.atLeast ? 1 : 0; } }
    p.A[k] = a; }

  /* exposure */
  const seenE = new Set();
  for(const e of raw.exposure){ if(seenE.has(e.exposure_id)){ add('error', 'exposure_id appears more than once', e.exposure_id); continue; } seenE.add(e.exposure_id);
    const p = link(e.client_id, 'exposure', e._row); if(!p) continue; const where = e.exposure_id;
    const x = { id: e.exposure_id, int: e.intervention_id, status: (e.status || '').toLowerCase(), rec: dchk(e.recommended_date, where, 'recommended_date'),
      start: dchk(e.start_date, where, 'start_date'), end: dchk(e.end_date, where, 'end_date'), reason: e.end_reason || '', by: e.delivered_by || '', f: {} };
    for(const v of xVars){ const val = check(v, e[v.name], where); if(v.name !== 'intervention_id' && v.name !== 'delivered_by') x.f[v.name] = val; }
    if(x.rec == null && x.start == null) add('error', 'Exposure row has neither a recommendation date nor a start date', where);
    if(x.rec != null && x.start != null && x.rec > x.start) add('error', 'Recommendation date is after start date', where);
    if(x.start != null && x.end != null && x.start > x.end) add('error', 'Start date is after end date', where);
    const st = x.status;
    if(['started','completed','discontinued'].includes(st) && x.start == null) add('error', 'Status does not agree with dates: no start date', where + ' (' + st + ')');
    if(['completed','discontinued'].includes(st) && x.end == null) add('error', 'Status does not agree with dates: no end date', where + ' (' + st + ')');
    if(['recommended','declined'].includes(st) && x.start != null) add('error', 'Status does not agree with dates: start date on a spell not taken up', where + ' (' + st + ')');
    if(!['recommended','declined','started','completed','discontinued'].includes(st)) add('error', 'Unknown exposure status', where + ' = ' + e.status);
    x.got = x.start != null && ['started','completed','discontinued'].includes(st);
    p.X.push(x); }

  /* events */
  const evVars = order.filter(v => v.type === 'event' && v.ev);
  const evTypes = new Set(); evVars.forEach(v => { evTypes.add(v.ev.start); if(v.ev.end) evTypes.add(v.ev.end); });
  for(const e of raw.events){ const p = link(e.client_id, 'events', e._row); if(!p) continue; const d = dchk(e.event_date, p.id, 'event_date');
    if(d == null){ add('error', 'Event has no valid date', p.id + ' ' + e.event_type); continue; }
    if(!evTypes.has(e.event_type)) add('warning', 'Event type is not used by any outcome definition', e.event_type);
    p.E.push({type: e.event_type, d}); }
  const people = all.filter(p => p.in);
  for(const p of people){ p.E.sort((a, b) => a.d - b.d); p.X.sort((a, b) => (a.start ?? a.rec ?? 0) - (b.start ?? b.rec ?? 0));
    for(const v of evVars){ if(!v.ev.end) continue; let open = false; for(const e of p.E){ if(e.type === v.ev.start) open = true; else if(e.type === v.ev.end){ if(!open) add('error', 'Events out of order: ' + v.ev.end + ' without an earlier ' + v.ev.start, p.id); open = false; } } break; } }

  /* as-at date */
  let latest = 0; for(const p of people){ latest = Math.max(latest, p.enrol, p.exit ?? 0); for(const k in p.A) latest = Math.max(latest, p.A[k].date ?? 0);
    for(const x of p.X) latest = Math.max(latest, x.rec ?? 0, x.start ?? 0, x.end ?? 0); for(const e of p.E) latest = Math.max(latest, e.d); }
  const asAt = S.asAtMode === 'today' ? TODAY : Math.min(latest, TODAY);
  const m = { msgs, vars, order, sched, ks, all, people, byId, asAt, latest, evVars,
    targets: order.filter(v => v.role === 'target'), procs: order.filter(v => v.role === 'process' && v.table === 'outcomes'), assessT: order.filter(v => v.role === 'target' && v.table === 'outcomes'), deliv: order.filter(v => v.role === 'process' && v.table === 'exposure'),
    chars: order.filter(v => v.table === 'recipients' && v.role === 'characteristic'), cache: {} };
  let inferred = 0;
  for(const p of people){ p.fu = asAt - p.enrol;
    for(const v of evVars) p.ach[v.name] = achDay(p, v.ev, asAt);
    for(const k of ks) if(!p.A[k] && !(p.exit != null && p.exit < p.enrol + sched[k].due) && p.enrol + sched[k].due + sched[k].win < asAt) inferred++; }
  if(inferred) add('info', 'Assessments past their window with no row supplied, treated as missed', inferred + ' assessment occasions');
  /* tertile bins for numeric characteristics */
  for(const v of m.chars) if(['continuous','count'].includes(v.type)){ const xs = people.map(p => p.c[v.name]).filter(x => x != null).sort((a, b) => a - b);
    if(xs.length > 5){ const q1 = xs[Math.floor(xs.length / 3)], q2 = xs[Math.floor(2 * xs.length / 3)];
      v.bin = x => x == null ? null : x < q1 ? 'Under ' + q1 : x < q2 ? q1 + ' to ' + (q2 - 1) : q2 + ' or more'; v.codes = ['Under ' + q1, q1 + ' to ' + (q2 - 1), q2 + ' or more']; } }
  return m;
}

function achDay(p, ev, asAt){
  let best = null;
  for(let i = 0; i < p.E.length; i++){ const e = p.E[i]; if(e.type !== ev.start) continue;
    if(!ev.min){ return e.d - p.enrol; }
    let end = asAt; for(let j = i + 1; j < p.E.length; j++) if(p.E[j].type === ev.end){ end = p.E[j].d; break; }
    if(end - e.d >= ev.min){ const a = e.d - p.enrol + ev.min; if(best == null || a < best) best = a; } }

const basisNote = v => v.basis === 'change' && v.type !== 'binary' ? 'change from baseline' : v.basis === 'final' ? 'by the final assessment' : 'at each assessment';
function vOverview(){ const P = M.people; const inProg = P.filter(p => p.exit == null).length; let due = 0, got = 0;
  for(const p of P) for(const k of M.ks) if(k > 0){ const st = aState(p, k); if(st !== 'not_due' && st !== 'na'){ due++; if(st === 'observed') got++; } }
  let h = `<section class="grid tiles">
    <div class="card tile"><b>${P.length}</b><span>recipients with consent, of ${M.all.length} enrolled</span></div>
    <div class="card tile"><b>${inProg}</b><span>still in the programme</span></div>
    <div class="card tile"><b>${due ? (100 * got / due).toFixed(0) + '%' : '–'}</b><span>of follow-up assessments due were obtained (${got} of ${due})</span></div>
    <div class="card tile"><b>${dstr(M.asAt)}</b><span>date the data are evaluated at</span></div></section>`;
  if(M.targets.length){ h += `<section><h2>Target outcomes</h2><p class="note">The probability is the chance, given the data so far, that the true value is on or above the benchmark, or the expected path towards it.</p><div class="grid targets">`;
    for(const v of M.targets){
      if(v.table === 'events'){ const r = evalOutcome(v, null), st = statOf(r);
        h += `<div class="card tcard"><h3>${esc(v.label)}</h3><div class="row"><span class="big">${r.n ? p2(r.p) : '–'}</span><span>${pill(st)}<br><span class="note">probability of meeting the benchmark</span></span></div>
          <div class="note">${r.n ? `<b>${r.s} of ${r.n}</b> people with ${v.ev.within} days of follow-up reached it: estimate ${fmt(v, r.mean, 'bin')} (95% credible interval ${fmt(v, r.lo, 'bin')} to ${fmt(v, r.hi, 'bin')}), benchmark ${fmt(v, v.bench, 'bin')}.` : 'Nobody has been enrolled long enough to be counted yet.'}
          ${r.c.notYet ? ` A further ${r.c.notYet} are not yet counted; ${r.c.early} of them have already reached it.` : ''}</div>${curveChart(v)}
          <div class="note">Cumulative share reaching the outcome, by days since enrolment.</div></div>`; continue; }
      const L = latestOf(v), ch = isChange(v), bin = v.type === 'binary'; h += `<div class="card tcard"><h3>${esc(v.label)}</h3>`;
      if(L){ const r = L.r, f = z => fmt(v, z, r.type, ch);
        h += `<div class="row"><span class="big">${p2(r.p)}</span><span>${pill(statOf(r))}<br><span class="note">probability of being on track at assessment ${L.k}</span></span></div>
          <div class="note">At assessment ${L.k} (day ${M.sched[L.k].due}), ${bin ? `<b>${r.s} of ${r.n}</b> people` : `across <b>${r.n}</b> people`}: estimate ${f(r.mean)} (95% credible interval ${f(r.lo)} to ${f(r.hi)}), against ${f(r.target)} expected at this point. Benchmark: ${f(v.bench)} ${basisNote(v)}.</div>`; }
      else h += `<div class="note">No follow-up assessments are due yet.</div>`;
      h += `${trajChart(v, 340, 170)}<div class="note">${ch ? 'Mean change from baseline' : bin ? 'Share of people' : 'Mean score'}, by days since enrolment.</div></div>`; }
    h += `</div></section>`; }
  const rowsV = M.assessT.concat(M.procs);
  if(rowsV.length){ const fk = M.ks.filter(k => k > 0); let grp = '';
    h += `<section class="card"><h2>Outcomes at each assessment</h2><p class="note">Each cell shows the estimate and the probability that the cohort is on track at that point. For change scores, the expected value rises in a straight line from zero at baseline to the benchmark at the final assessment.</p>
      <div class="scroll"><table><thead><tr><th>Outcome</th><th>Benchmark</th>${fk.map(k => `<th>Assessment ${k} <small style="font-weight:400">day ${M.sched[k].due}</small></th>`).join('')}</tr></thead><tbody>`;
    for(const v of rowsV){ const g = v.role === 'target' ? 'Target outcomes' : 'Process outcomes'; if(g !== grp && M.assessT.length){ grp = g; h += `<tr class="grp"><td colspan="${2 + fk.length}">${g}</td></tr>`; }
      const ch = isChange(v); h += `<tr><td>${esc(v.label)}</td><td>${fmt(v, v.bench, v.type === 'binary' ? 'bin' : 'num', ch)}<small>${basisNote(v)}</small></td>`;
      for(const k of fk){ if(v.at && !v.at.includes(k)){ h += '<td class="note">not assessed</td>'; continue; } const r = evalOutcome(v, k), st = statOf(r);
        h += `<td${tipAttr(r.n ? `${v.label}, assessment ${k}\nEstimate ${fmt(v, r.mean, r.type, ch)} (${fmt(v, r.lo, r.type, ch)} to ${fmt(v, r.hi, r.type, ch)})\nExpected at this point ${fmt(v, r.target, r.type, ch)}\nn = ${r.n}` : 'No assessments due yet')}>${pill(st, r.n ? p2(r.p) : '')}<small>${r.n ? fmt(v, r.mean, r.type, ch) + ' vs ' + fmt(v, r.target, r.type, ch) + ' expected, n = ' + r.n : ''}</small></td>`; }
      h += '</tr>'; }
    h += `</tbody></table></div></section>`;
    if(M.procs.length) h += `<section><h2>Trajectories of process outcomes</h2>${LEG}<div class="grid mini" style="margin-top:10px">${M.procs.map(v => { const L = latestOf(v);
        return `<div class="card"><h3><span>${esc(v.label)}</span>${pill(statOf(L && L.r))}</h3>${trajChart(v)}<div class="note">Days since enrolment</div></div>`; }).join('')}</div></section>`; }
  if(M.deliv.length){ h += `<section class="card"><h2>Delivery and engagement</h2><p class="note">Measures recorded on intervention spells. Split them by intervention or adviser in the Segments tab.</p><div class="scroll"><table><thead><tr><th>Measure</th><th class="n">Spells</th><th class="n">Benchmark</th><th>Estimate (95% credible interval)</th><th class="n">P(meets benchmark)</th><th>Status</th></tr></thead><tbody>`;
    for(const v of M.deliv){ const r = evalOutcome(v, null); h += `<tr><td>${esc(v.label)}</td><td class="n">${r.n}</td><td class="n">${fmt(v, v.bench, r.type)}</td><td>${r.n ? `${fmt(v, r.mean, r.type)} (${fmt(v, r.lo, r.type)} to ${fmt(v, r.hi, r.type)})` : '–'}</td><td class="n">${r.n ? p2(r.p) : '–'}</td><td>${pill(statOf(r))}</td></tr>`; }
    h += `</tbody></table></div></section>`; }
  return h; }

function outcomeOptions(sel){ const grp = (lab, vs) => vs.length ? `<optgroup label="${lab}">${vs.map(v => `<option value="${esc(v.name)}"${v.name === sel ? ' selected' : ''}>${esc(v.label)}</option>`).join('')}</optgroup>` : '';
  return grp('Target outcomes', M.targets) + grp('Process outcomes', M.procs) + grp('Delivery and engagement', M.deliv); }
function vSegments(){ const defs = splitDefs(); const allV = M.targets.concat(M.procs, M.deliv); if(!allV.length) return '<div class="card">No outcomes are defined in the configuration table.</div>';
  let v = M.vars[S.segOutcome]; if(!v || !allV.includes(v)){ v = allV[0]; S.segOutcome = v.name; }
  const assess = v.table === 'outcomes', fk = assess ? followKs(v) : []; let k = assess ? +S.segK : null; if(assess && !fk.includes(k)){ k = Math.max(...fk); S.segK = String(k); }
  let d1 = defs.find(d => d.key === S.split1) || defs[0]; S.split1 = d1.key; const d2 = defs.find(d => d.key === S.split2 && d.key !== d1.key && d.kind === 'r') || null; if(!d2) S.split2 = '';
  const sg = segments(v, k, d1, d2), o = sg.overall, ch = isChange(v); const shown = sg.rows.filter(r => !r.hide);
  const vals = [o.target, o.lo, o.hi]; shown.forEach(r => vals.push(r.lo, r.hi, r.target)); const [lo, hi] = niceRange(vals, o.type);
  const sameT = shown.every(r => Math.abs(r.target - o.target) < 1e-9);
  const row = (lab, r, strong) => `<tr><td>${strong ? '<b>' + lab + '</b>' : lab}</td><td class="n">${r.people ?? new Set(sg.c.obs.map(q => q.p.id)).size}</td><td class="n">${fmt(v, r.raw, r.type, ch)}<small>n = ${r.n}</small></td><td>${fmt(v, r.mean, r.type, ch)}<small>${fmt(v, r.lo, r.type, ch)} to ${fmt(v, r.hi, r.type, ch)}</small></td><td>${forest(r, lo, hi, r.target, v)}</td><td class="n">${p2(r.p)}</td><td>${pill(statOf(r))}</td></tr>`;
  return `<section class="card"><div class="controls">
      <label>Outcome<select id="segOutcome" data-set="segOutcome">${outcomeOptions(v.name)}</select></label>
      ${assess ? `<label>Assessment<select id="segK" data-set="segK">${fk.map(q => `<option value="${q}"${q === k ? ' selected' : ''}>Assessment ${q} (day ${M.sched[q].due})</option>`).join('')}</select></label>` : ''}
      <label>Split by<select id="split1" data-set="split1">${defs.map(d => `<option value="${d.key}"${d === d1 ? ' selected' : ''}>${esc(d.label)}</option>`).join('')}</select></label>
      <label>And by<select id="split2" data-set="split2"><option value="">(none)</option>${defs.filter(d => d.kind === 'r' && d !== d1).map(d => `<option value="${d.key}"${d === d2 ? ' selected' : ''}>${esc(d.label)}</option>`).join('')}</select></label></div></section>
    <section class="card"><h2>${esc(v.label)}${assess ? ', assessment ' + k : ''}</h2>
      <p class="note">${v.table === 'events' ? `People enrolled at least ${v.ev.within} days. ` : v.table === 'exposure' ? 'Each intervention spell with a recorded value counts once. ' : ''}Segment estimates are pulled towards the cohort estimate with a weight of ${S.kappa} notional observations, so small segments are not over-read. ${d1.kind === 'x' && v.table !== 'exposure' ? 'A person appears in every group that applies to them, so groups overlap and differences are not evidence of cause.' : ''}</p>
      ${LEG}<div class="scroll" style="margin-top:8px"><table><thead><tr><th>Segment</th><th class="n">Recipients</th><th class="n">Observed</th><th>Estimate<br><small style="font-weight:400">95% credible interval</small></th><th>${sameT ? 'Against benchmark ' + fmt(v, o.target, o.type, ch) : 'Against expected value'}</th><th class="n">P(on track)</th><th>Status</th></tr></thead><tbody>
      ${row('All recipients', o, true)}${sg.rows.map(r => r.hide ? `<tr><td>${esc(r.label)}</td><td class="n">fewer than ${S.minCell}</td><td colspan="5" class="note">Not shown: too few people to report</td></tr>` : row(esc(r.label), r)).join('')}
      <tr><td colspan="4"></td><td>${forestAxis(lo, hi, v, o.type)}</td><td colspan="2"></td></tr></tbody></table></div></section>`; }

function vInterventions(){ const iv = M.vars.intervention_id, feats = spellFeats(); const gv = feats.find(f => f.name === S.ivGroup) || null; if(!gv) S.ivGroup = ''; const kv = gv || iv;
  const groups = new Map();
  for(const p of M.people) for(const x of p.X){ const key = gv ? (x.f[gv.name] ?? '') : x.int; if(!groups.has(key)) groups.set(key, {code: key, rec: 0, up: 0, got: 0, comp: 0, disc: 0, ses: [], sat: [], ints: new Set(), x}); const c = groups.get(key); c.ints.add(x.int);
    if(x.rec != null){ c.rec++; if(x.got) c.up++; } if(x.got){ c.got++; if(x.status === 'completed') c.comp++; if(x.status === 'discontinued') c.disc++;
      if(x.f.sessions_attended != null) c.ses.push(x.f.sessions_attended); if(x.f.satisfaction != null) c.sat.push(x.f.satisfaction); } }
  const pos = c => { const i = kv && kv.codes ? kv.codes.indexOf(c.code) : -1; return i < 0 ? 999 : i; };
  const list = [...groups.values()].sort((a, b) => pos(a) - pos(b) || String(a.code).localeCompare(String(b.code)));
  const tr = list.reduce((s, c) => s + c.rec, 0), tu = list.reduce((s, c) => s + c.up, 0), pbar = tr ? tu / tr : 0.5;
  list.forEach(c => { if(c.rec){ const a = S.kappa * pbar + c.up, b = S.kappa * (1 - pbar) + c.rec - c.up; c.r = {n: c.rec, mean: a / (a + b), lo: qbeta(0.025, a, b), hi: qbeta(0.975, a, b), type: 'bin'}; } });
  const hasSes = !!M.vars.sessions_attended, hasSat = !!M.vars.satisfaction, extra = gv ? 1 : feats.length;
  const name = c => c.code === '' ? '<span class="note">(none recorded)</span>' : esc(codeLabel(kv ? kv.name : 'intervention_id', c.code)) + (gv ? '' : `<small class="mono">${esc(c.code)}</small>`);
  return `${feats.length ? `<section class="card"><div class="controls"><label>Show<select id="ivGroup" data-set="ivGroup"><option value="">Each intervention</option>${feats.map(f => `<option value="${esc(f.name)}"${f === gv ? ' selected' : ''}>Grouped by ${esc(f.label.toLowerCase())}</option>`).join('')}</select></label></div></section>` : ''}
    <section class="card"><h2>Uptake and engagement by ${gv ? esc(gv.label.toLowerCase()) : 'intervention'}</h2><p class="note">Uptake is the share of recommendations that led to a start. Across all interventions it is ${(pbar * 100).toFixed(0)}% (${tu} of ${tr}), shown as the dashed line. Estimates are pulled towards that figure with a weight of ${S.kappa} notional observations. ${list.length} rows.</p>
    ${LEG}<div class="scroll" style="margin-top:8px"><table><thead><tr><th>${gv ? esc(gv.label) : 'Intervention'}</th>${gv ? '<th class="n">Interventions</th>' : feats.map(f => `<th>${esc(f.label)}</th>`).join('')}<th class="n">Recommended</th><th class="n">Started</th><th>Uptake<br><small style="font-weight:400">95% credible interval</small></th><th>Uptake, 0 to 100%</th><th class="n">Completed<br><small style="font-weight:400">of spells ended</small></th>${hasSes ? '<th class="n">Mean sessions</th>' : ''}${hasSat ? '<th class="n">Mean satisfaction</th>' : ''}</tr></thead><tbody>
    ${list.map(c => `<tr><td>${name(c)}</td>${gv ? `<td class="n">${c.ints.size}</td>` : feats.map(f => `<td>${esc(c.x.f[f.name] == null ? '–' : codeLabel(f.name, String(c.x.f[f.name])))}</td>`).join('')}<td class="n">${c.rec || '–'}</td><td class="n">${c.got}</td>
      <td>${c.r ? `${(c.r.mean * 100).toFixed(0)}%<small>${(c.r.lo * 100).toFixed(0)}% to ${(c.r.hi * 100).toFixed(0)}%</small>` : '–'}</td><td>${c.r ? forest(c.r, 0, 1, pbar, {}) : ''}</td>
      <td class="n">${c.comp + c.disc ? (100 * c.comp / (c.comp + c.disc)).toFixed(0) + '%' : '–'}<small>${c.comp} of ${c.comp + c.disc}</small></td>
      ${hasSes ? `<td class="n">${c.ses.length ? mean(c.ses).toFixed(1) : '–'}</td>` : ''}${hasSat ? `<td class="n">${c.sat.length ? mean(c.sat).toFixed(2) : '–'}<small>n = ${c.sat.length}</small></td>` : ''}</tr>`).join('')}
    <tr><td colspan="${4 + extra}"></td><td>${forestAxis(0, 1, {}, 'bin')}</td><td colspan="${1 + hasSes + hasSat}"></td></tr></tbody></table></div></section>
    <section class="card"><p class="note" style="margin:0">To see how outcomes differ for people who received each intervention or type of intervention, open the Segments tab and choose a split by interventions received.</p></section>`; }

function indRows(){ const q = S.q.trim().toLowerCase(); const rows = M.people.map(p => [p, person(p)]).filter(([p, i]) => (!q || p.id.toLowerCase().includes(q)) && (!S.fProv || p.c.provider_id === S.fProv) && (!S.fFlag || i.flag === S.fFlag));
  const rank = {review: 0, watch: 1, on: 2, early: 3, done: 4, exit: 5}; rows.sort((a, b) => rank[a[1].flag] - rank[b[1].flag] || (a[1].avg ?? 9) - (b[1].avg ?? 9) || a[0].id.localeCompare(b[0].id));
  const bar = i => i.n ? `<span class="bar3"${tipAttr(`${i.on} on track, ${i.unc} uncertain, ${i.off} off track`)}><span style="width:${100 * i.on / i.n}%;background:var(--good)"></span><span style="width:${100 * i.unc / i.n}%;background:var(--warn)"></span><span style="width:${100 * i.off / i.n}%;background:var(--crit)"></span></span> <small style="display:inline">${i.on}/${i.unc}/${i.off}</small>` : '<small>–</small>';
  return rows.map(([p, i]) => `<tr class="pick${p.id === S.person ? ' sel' : ''}" data-person="${esc(p.id)}" tabindex="0"><td class="mono">${esc(p.id)}</td><td class="n">${p.fu}</td><td>${flagPill(i.flag)}</td><td>${bar(i)}</td><td class="n">${i.avg == null ? '–' : i.avg.toFixed(2)}</td></tr>`).join('') || '<tr><td colspan="5" class="note">Nobody matches these filters.</td></tr>'; }
function personPanel(){ const p = M.byId.get(S.person); if(!p || !p.in) return '<div class="card note">Choose a person from the list to see their progress.</div>'; const i = person(p);
  const cv = M.chars.map(v => `<dt>${esc(v.label)}</dt><dd>${esc(p.c[v.name] == null ? '–' : codeLabel(v.name, String(p.c[v.name])))}</dd>`).join('');
  const assess = M.ks.map(k => { const st = aState(p, k); const lab = {observed: 'obtained', 'missed*': 'missed (no row supplied)', na: 'not applicable (exited)', not_due: 'not yet due'}[st] || st.replace(/_/g, ' '); return `A${k}: ${lab}${p.A[k] && p.A[k].date != null ? ' ' + dstr(p.A[k].date) : ''}`; }).join('; ');
  const tg = M.evVars.map(v => `<dt>${esc(v.label)}</dt><dd>${p.ach[v.name] != null && p.ach[v.name] <= v.ev.within ? 'Yes, on day ' + p.ach[v.name] : p.fu >= v.ev.within ? 'No' : 'Not yet (day ' + p.fu + ' of ' + v.ev.within + ')'}</dd>`).join('');
  const cont = i.ms.filter(m => !m.binary), bin = i.ms.filter(m => m.binary);
  return `<div class="card"><div class="row" style="justify-content:space-between"><h2 class="mono" style="margin:0">${esc(p.id)}</h2><span>${flagPill(i.flag)} <span class="note">${esc(i.why)}</span></span></div>
      <dl style="margin-top:10px"><dt>Enrolled</dt><dd>${dstr(p.enrol)} (day ${p.fu})${p.exit != null ? '; exited ' + dstr(p.exit) : ''}</dd>${cv}<dt>Assessments</dt><dd>${assess}</dd>${M.evVars.length ? `<dt>Work</dt><dd>${esc(i.work)}</dd>` : ''}${tg}
      ${bin.map(m => `<dt>${esc(m.v.label)}</dt><dd>${m.k == null ? '–' : (m.val === 1 ? 'Yes' : 'No') + ' at assessment ' + m.k}</dd>`).join('')}
      ${i.avg != null ? `<dt>Average P(on track)</dt><dd>${i.avg.toFixed(2)} across ${i.n} measures at assessment ${Math.max(...cont.filter(m => m.k != null).map(m => m.k))}</dd>` : ''}</dl></div>
    <div><h3 style="margin-bottom:8px">Scores against the expected path</h3><div class="legend" style="margin-bottom:8px"><span><svg width="26" height="10"><line x1="1" x2="25" y1="5" y2="5" stroke="var(--series)" stroke-width="2"/><circle cx="13" cy="5" r="4" fill="var(--series)"/></svg> Recorded score</span><span><svg width="26" height="10"><line x1="1" x2="25" y1="5" y2="5" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3"/></svg> Path from own baseline to the benchmark</span></div>
      <div class="grid mini" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">${cont.map(m => `<div class="card"><h3><span>${esc(m.v.label)}</span>${pill(m.st, m.p != null ? p2(m.p) : '')}</h3>${personChart(m)}
        <div class="note">${m.p != null ? `${isChange(m.v) ? 'Change' : 'Score'} ${fmt(m.v, m.x, 'num', isChange(m.v))}, expected ${fmt(m.v, m.exp, 'num', isChange(m.v))} by assessment ${m.k}` : 'No follow-up score yet'}</div></div>`).join('')}</div></div>
    <div class="card"><h3 style="margin-bottom:6px">Interventions</h3><div class="scroll"><table><thead><tr><th>Intervention</th><th>Status</th><th>Recommended</th><th>Started</th><th>Ended</th>${M.vars.sessions_attended ? '<th class="n">Sessions</th>' : ''}</tr></thead><tbody>
      ${p.X.map(x => `<tr><td>${esc(codeLabel('intervention_id', x.int))}</td><td>${esc(x.status)}${x.reason && x.reason !== x.status ? '<small>' + esc(x.reason) + '</small>' : ''}</td><td>${dstr(x.rec) || '–'}</td><td>${dstr(x.start) || '–'}</td><td>${dstr(x.end) || '–'}</td>${M.vars.sessions_attended ? `<td class="n">${x.f.sessions_attended ?? '–'}</td>` : ''}</tr>`).join('') || '<tr><td colspan="6" class="note">None recorded.</td></tr>'}</tbody></table></div>
      ${p.E.length ? `<h3 style="margin:12px 0 6px">Events</h3><p class="note">${p.E.map(e => esc(e.type.replace(/_/g, ' ')) + ' ' + dstr(e.d)).join('; ')}</p>` : ''}</div>`; }
function vIndividuals(){ if(!S.person || !M.byId.get(S.person)?.in){ const f = M.people.map(p => [p, person(p)]).filter(q => q[1].flag === 'review').sort((a, b) => (a[1].avg ?? 9) - (b[1].avg ?? 9))[0]; S.person = f ? f[0].id : (M.people[0] || {}).id || ''; }
  const pv = M.vars.provider_id, provs = [...new Set(M.people.map(p => p.c.provider_id).filter(Boolean))].sort(); const counts = {}; M.people.forEach(p => { const f = person(p).flag; counts[f] = (counts[f] || 0) + 1; });
  return `<section class="card"><div class="controls"><label>Find an ID<input type="search" id="q" value="${esc(S.q)}" placeholder="e.g. R0042"></label>
      <label>Provider<select id="fProv" data-set="fProv"><option value="">All</option>${provs.map(x => `<option value="${esc(x)}"${x === S.fProv ? ' selected' : ''}>${esc(codeLabel('provider_id', x))}</option>`).join('')}</select></label>
      <label>Flag<select id="fFlag" data-set="fFlag"><option value="">All</option>${Object.keys(FLAG).map(f => `<option value="${f}"${f === S.fFlag ? ' selected' : ''}>${FLAG[f][0]} (${counts[f] || 0})</option>`).join('')}</select></label>
      <span class="note" style="max-width:52ch">For each measure the dashboard estimates the chance that the person's true score is on or above the path to the benchmark, allowing for measurement error. Review means an average below 0.4 or a missed latest assessment.</span></div></section>
    <section class="two"><div class="card list"><table><thead><tr><th>ID</th><th class="n">Day</th><th>Flag</th><th>Measures<br><small style="font-weight:400">on / uncertain / off</small></th><th class="n">Average P</th></tr></thead><tbody id="indrows">${indRows()}</tbody></table></div>
      <div id="personpanel" style="display:flex;flex-direction:column;gap:14px">${personPanel()}</div></section>`; }

function vData(){ const t = ['recipients','exposure','outcomes','events','config','schedule']; const lev = {error: 'Error', warning: 'Warning', info: 'Note'};
  const ms = M.msgs.slice().sort((a, b) => ['error','warning','info'].indexOf(a.level) - ['error','warning','info'].indexOf(b.level));
  const ne = ms.filter(m => m.level === 'error').reduce((s, m) => s + m.count, 0), nw = ms.filter(m => m.level === 'warning').reduce((s, m) => s + m.count, 0);
  return `<section class="card"><h2>Data source</h2><p>${esc(SOURCE)}</p>${LOADERR ? `<p class="msg error">${esc(LOADERR)}</p>` : ''}
      <div class="controls"><label>Load CSV files (select all six together)<input type="file" id="files" multiple accept=".csv,text/csv"></label>
        <button class="btn alt" id="usedemo" type="button">Use the built-in dummy data</button>
        <label>Evaluate as at<select id="asAtMode" data-set="asAtMode"><option value="data"${S.asAtMode === 'data' ? ' selected' : ''}>Latest date in the data (${dstr(Math.min(M.latest, TODAY))})</option><option value="today"${S.asAtMode === 'today' ? ' selected' : ''}>Today (${dstr(TODAY)})</option></select></label></div>
      <p class="note" style="margin-top:10px">Files are matched by name: recipients.csv, exposure.csv, outcomes.csv, events.csv, config.csv and schedule.csv. They are read in this browser only and are not sent anywhere. When this page is served from a web server, it first looks for those files in a folder called <span class="mono">data</span> beside it.</p></section>
    <section class="card"><h2>Tables loaded</h2><div class="scroll"><table><thead><tr><th>Table</th><th class="n">Rows</th><th>Columns</th></tr></thead><tbody>${t.map(k => `<tr><td>${k}</td><td class="n">${RAW[k] ? RAW[k].length : 0}</td><td class="note">${RAW[k] ? esc(RAW[k].columns.join(', ')) : 'not supplied'}</td></tr>`).join('')}</tbody></table></div></section>
    <section><h2>Checks on loading</h2><p class="note">${ne} errors and ${nw} warnings. Values that fail a check are left out of the calculations; everything else is used.</p>
      ${ms.map(m => `<div class="msg ${m.level}"><b>${lev[m.level]}:</b> ${esc(m.rule)} <span class="note">(${m.count})</span>${m.ex.length ? `<small>${m.ex.map(esc).join('; ')}${m.count > m.ex.length ? '; …' : ''}</small>` : ''}</div>`).join('') || '<div class="msg info">No problems found.</div>'}</section>`; }

function vMethod(){ const num = (id, lab, min, max, step) => `<label>${lab}<input type="number" id="${id}" data-num="${id}" value="${S[id]}" min="${min}" max="${max}" step="${step}"></label>`;
  return `<section class="card"><h2>Options</h2><div class="controls">${num('hi', 'On track when P is at least', 0.5, 0.99, 0.05)}${num('lo', 'Off track when P is at most', 0.01, 0.5, 0.05)}
      ${num('prior', 'Prior weight for the cohort', 0.5, 50, 0.5)}${num('kappa', 'Pooling weight for segments', 0, 100, 1)}${num('rel', 'Reliability of scores', 0.3, 0.99, 0.05)}${num('minCell', 'Smallest segment shown', 1, 50, 1)}</div>
      <p class="note" style="margin-top:10px">Weights are counted in notional observations: a weight of 2 has the same pull as two people. Changes apply straight away to every tab.</p></section>
    <section class="card"><h2>How the figures are worked out</h2>
      <p><b>The question asked of every outcome.</b> Given the data so far, how probable is it that the true value meets the benchmark? An outcome is shown as on track when that probability is at least ${S.hi}, off track when it is at most ${S.lo}, and uncertain in between.</p>
      <ul><li><b>Yes or no outcomes</b> (including target outcomes built from events) use a beta-binomial model. The starting assumption (prior) is centred on the benchmark with a weight of ${S.prior} observations, so with no data the probability is about one half.</li>
      <li><b>Scores</b> use a normal model with unknown mean and variance, giving a Student t distribution for the mean. The prior is centred on the expected value with the same weight.</li>
      <li><b>Change scores</b> are follow-up minus the person's own baseline. The expected change rises in a straight line from zero at baseline to the benchmark at the final assessment, so interim assessments can be judged. A benchmark to be reached by the final assessment is treated the same way, starting from the baseline value.</li>
      <li><b>Derived outcomes</b> are worked out from other columns when the data are loaded: the mean of several items, or whether a score has reached a given value.</li>
      <li><b>Event outcomes</b> count only people enrolled for the whole follow-up period in the definition. People who left the programme are kept in and count as not reaching the outcome unless an event shows that they did.</li>
      <li><b>Missing assessments</b> follow each measure's missing rule in the configuration table: left out, or counted as not achieved. Assessments that fall after someone has left the programme are not counted as due.</li>
      <li><b>Segments</b> use the same models, with the prior centred on the whole-cohort estimate and a weight of ${S.kappa} observations. This partial pooling keeps small segments from swinging on a few results.</li>
      <li><b>Individuals.</b> A person's recorded change is combined with the spread of changes across the cohort at the same assessment, allowing for measurement error (reliability ${S.rel}). The result is the probability that their true change is on or above the expected path. The flag uses the average of these probabilities across measures.</li></ul>
      <p class="note">Flags are prompts for attention, not verdicts. With many segments and measures some will be flagged by chance, and groups defined by the intervention received differ in other ways too.</p></section>
    <section class="card"><h2>Conventions used in the configuration table</h2><ul>
      <li><span class="mono">range_or_codes</span>: a range such as <span class="mono">0-10</span>, or codes separated by <span class="mono">|</span>, each optionally with a label, such as <span class="mono">P1=Provider North|P2=Provider Central</span>.</li>
      <li><span class="mono">benchmark_basis</span>: <span class="mono">change</span> when the benchmark is a change from baseline by the final assessment; <span class="mono">final</span> when it is a value to reach by the final assessment; <span class="mono">level</span> when it applies at every assessment. Blank means level.</li>
      <li><span class="mono">definition</span> for event outcomes: <span class="mono">start=job_start; end=job_end; min_days=91; within_days=273</span>. Leave out <span class="mono">end</span> and <span class="mono">min_days</span> when the outcome is simply that the event happened.</li>
      <li><span class="mono">definition</span> for derived outcomes: <span class="mono">mean=ps_finance|ps_housing|ps_transport|ps_care</span> for the mean of the items answered, or <span class="mono">source=employment_closeness; at_least=5</span> for a yes or no outcome.</li>
      <li><span class="mono">role</span>: <span class="mono">characteristic</span>, <span class="mono">feature</span>, <span class="mono">process</span>, <span class="mono">target</span>, or <span class="mono">component</span> for an item that is checked and used in a derived outcome but not evaluated on its own.</li>
      <li><span class="mono">missing_rule</span>: <span class="mono">excluded</span>, <span class="mono">not_achieved</span> (yes or no outcomes) or <span class="mono">no_change</span> (scores).</li></ul></section>`; }

/* ============================================================ rendering and events */
const VIEWS = { overview: vOverview, segments: vSegments, interventions: vInterventions, individuals: vIndividuals, 'data-checks': vData, method: vMethod };
function render(){ $('#tabs').innerHTML = TABS.map(([k, l]) => `<button role="tab" aria-selected="${k === S.tab}" data-tab="${k}">${l}</button>`).join('');
  $('#subhd').textContent = M ? `${M.people.length} recipients · data as at ${dstr(M.asAt)}` : ''; $('#demoflag').hidden = !SOURCE.startsWith('Built-in');
  let html; try { html = VIEWS[S.tab](); } catch(e){ console.error(e); html = `<div class="card"><h2>This view could not be drawn</h2><p>${esc(e.message)}</p><p class="note">Check the Data and checks tab for problems with the files.</p></div>`; }
  $('#view').innerHTML = html; }
function rebuild(){ M = buildModel(RAW); render(); }
function go(tab){ if(!VIEWS[tab]) tab = 'overview'; S.tab = tab; try { if(location.hash.slice(1) !== tab) history.replaceState(null, '', '#' + tab); } catch(e){} render(); window.scrollTo(0, 0); }
document.addEventListener('click', e => { const t = e.target.closest('[data-tab]'); if(t){ go(t.dataset.tab); return; }
  const pr = e.target.closest('[data-person]'); if(pr){ selectPerson(pr.dataset.person); return; }
  if(e.target.id === 'usedemo'){ loadDemo(); } });
document.addEventListener('keydown', e => { if(e.key === 'Enter'){ const pr = e.target.closest('[data-person]'); if(pr) selectPerson(pr.dataset.person); } });
function selectPerson(id){ S.person = id; document.querySelectorAll('#indrows tr').forEach(tr => tr.classList.toggle('sel', tr.dataset.person === id)); $('#personpanel').innerHTML = personPanel(); }
document.addEventListener('change', e => { const el = e.target;
  if(el.dataset.set){ S[el.dataset.set] = el.value; if(el.dataset.set === 'asAtMode') rebuild(); else render(); return; }
  if(el.dataset.num){ const x = parseFloat(el.value); if(!isNaN(x)){ S[el.dataset.num] = clamp(x, +el.min, +el.max); M.cache = {}; M.people.forEach(p => delete p._i); render(); } return; }
  if(el.id === 'files') loadFiles(el.files); });
document.addEventListener('input', e => { if(e.target.id === 'q'){ S.q = e.target.value; $('#indrows').innerHTML = indRows(); } });
const tip = $('#tip');
document.addEventListener('mousemove', e => { const t = e.target.closest ? e.target.closest('[data-tip]') : null; if(!t){ tip.style.display = 'none'; return; }
  tip.textContent = t.dataset.tip; tip.style.display = 'block'; const r = tip.getBoundingClientRect();
  tip.style.left = clamp(e.clientX + 14, 4, innerWidth - r.width - 4) + 'px'; tip.style.top = (e.clientY + 16 + r.height > innerHeight ? e.clientY - r.height - 10 : e.clientY + 16) + 'px'; });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if(VIEWS[h] && h !== S.tab){ S.tab = h; render(); } });

/* ============================================================ loading */
const NAMES = ['recipients','exposure','outcomes','events','config','schedule'];
function setRaw(texts, source){ const raw = {}; for(const k of NAMES) if(texts[k] != null) raw[k] = parseCSV(texts[k]); RAW = raw; SOURCE = source; LOADERR = ''; S.person = ''; rebuild(); }
function loadDemo(){ setRaw(JSON.parse($('#demo-data').textContent), 'Built-in dummy data: 350 invented recipients. No real people are represented.'); }
async function loadFiles(files){ const texts = {}; const names = [];
  for(const f of files){ const k = NAMES.find(n => f.name.toLowerCase().includes(n)); if(k){ texts[k] = await f.text(); names.push(f.name); } }
  const missing = NAMES.filter(n => n !== 'events' && texts[n] == null);
  if(missing.length){ LOADERR = 'Not loaded. Missing: ' + missing.map(n => n + '.csv').join(', ') + '. Select all the files together.'; render(); return; }
  setRaw(texts, 'Files loaded from this computer: ' + names.join(', ')); }
async function tryFolder(){ if(!/^https?:$/.test(location.protocol)) return false;
  try { const texts = {}; for(const n of NAMES){ const r = await fetch('data/' + n + '.csv', {cache: 'no-store'}); if(r.ok){ const t = await r.text(); if(!/^\s*</.test(t)) texts[n] = t; } else if(n !== 'events') return false; }
    if(NAMES.some(n => n !== 'events' && texts[n] == null)) return false; setRaw(texts, 'Live files in the data folder beside this page.'); return true; } catch(e){ return false; } }
(async function init(){ const h = location.hash.slice(1); if(VIEWS[h]) S.tab = h; loadDemo(); await tryFolder(); })();
</script>
</body>
</html>
